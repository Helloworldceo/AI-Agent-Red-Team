name: Daily red-team research

on:
  schedule:
    # 22:17 UTC = ~06:17 China Standard Time (UTC+8) — lands before the day starts.
    - cron: "17 22 * * *"
  workflow_dispatch: {} # lets you trigger a manual run from the Actions tab for testing

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check that the API key secret is configured
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "::error::GEMINI_API_KEY is not set as a repo secret."
            echo "::error::Add it at Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi

      - name: Run daily research job
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m research.generate_payload --api-key "$GEMINI_API_KEY"

      - name: Draft the LinkedIn post from today's finding
        working-directory: backend
        run: python -m research.draft_post

      - name: Commit and push the finding + post draft
        run: |
          git config user.name "Dawit Abdisa"
          git config user.email "davidabdisa.52@gmail.com"
          git add backend/research/findings/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            today=$(date -u +%F)
            git commit -m "Daily research: $today finding + post draft"
            git push
          fi
