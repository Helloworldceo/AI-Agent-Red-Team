name: Daily red-team research

on:
  schedule:
    # 22:17 UTC = ~06:17 China Standard Time (UTC+8) — lands before the day starts.
    - cron: "17 22 * * *"
  workflow_dispatch: {} # lets you trigger a manual run from the Actions tab for testing

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check that an API key secret is configured
        run: |
          if [ -z "${{ secrets.DEEPSEEK_API_KEY }}" ] && [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "::error::Neither DEEPSEEK_API_KEY nor GEMINI_API_KEY is set as a repo secret."
            echo "::error::Add one at Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi

      - name: Run daily research job
        working-directory: backend
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            python -m research.generate_payload --provider deepseek --api-key "$DEEPSEEK_API_KEY"
          else
            python -m research.generate_payload --provider gemini --api-key "$GEMINI_API_KEY"
          fi

      - name: Commit and push the finding
        run: |
          git config user.name "Dawit Abdisa"
          git config user.email "davidabdisa.52@gmail.com"
          git add backend/research/findings/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            today=$(date -u +%F)
            git commit -m "Daily research: $today finding"
            git push
          fi
