services:
  - type: web
    name: ai-agent-redteam-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        # CORS matches the browser's Origin header (scheme + host only, no path),
        # so this is the GitHub Pages domain itself, not the /AI-Agent-Red-Team/ path.
        value: https://helloworldceo.github.io
